<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - JB System Consulting Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
  <h1>Expense Tracker Demo</h1>
  <p>JB System Consulting — Internal Tool Proof-of-Concept</p>
    </header>

    <form id="expense-form">
      <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="e.g., Office supplies" required>
      </div>
      <div class="form-group">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" placeholder="e.g., 50" required>
      </div>
      <button type="submit">Add Expense</button>
    </form>

    <div id="expenses-container">
      <h2>Expenses</h2>
      <ul id="expenses-list"></ul>
      <div id="total-container">
        <strong>Total: $<span id="total">0</span></strong>
      </div>
    </div>
  </div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
